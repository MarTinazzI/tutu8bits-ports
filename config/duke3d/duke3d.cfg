; duke3d.cfg inicial do produto (spec 040, plano D-04/D-05): so as chaves que o produto muda; o jogo preenche o resto e
; regrava o arquivo completo ao sair. Spec 043 (D-05): esquema comum dos jogos de tiro (A pula, B agacha, X abre,
; Y usa o item, SELECT mapa, L3 liga/desliga o correr; indices da API de game controller: 7 = LS = L3). O lancar.sh copia para saves/jogos/duke3d/<versao>/.jfduke3d/ so quando falta.
