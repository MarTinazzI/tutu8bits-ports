// tutu8bits (spec 050, plano D-04): os botoes do controle no esquema dos jogos de tiro (spec 043, ports/config/controles_fps.csv).
// Copiado para saves/jogos/quake/<jogo>/<pasta do jogo>/ so quando falta; o Quake o regrava ao sair (o que o jogador
// mudar em "Customize controls" fica). X, Y, L2 e R3 sem acao: o Quake nao tem "usar" nem itens.
// START = menu (ESC, fixo no motor); o toque no VOL+ chega como START. Analogicos e mira: m17_controle.c.
bind "PAD_A" "+jump"
bind "PAD_B" "+movedown"
bind "PAD_R2" "+attack"
bind "PAD_L1" "impulse 12"
bind "PAD_R1" "impulse 10"
bind "PAD_CIMA" "+forward"
bind "PAD_BAIXO" "+back"
bind "PAD_ESQ" "+left"
bind "PAD_DIR" "+right"
bind "PAD_SELECT" "+showscores"
bind "PAD_L3" "m17_devagar"
