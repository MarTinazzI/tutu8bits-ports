# Opcoes fixas do RetroArch no M17 (spec 009, plano D-01/D-06/D-10). Dados, nao codigo (P3):
# ports/gerar_cfg.py copia este arquivo trocando @RAIZ@ pela pasta do cartao e acrescenta os botoes
# gerados do ports/config/keymap.json.

# Drivers: os mesmos do RetroArch de fabrica, que roda neste aparelho (gl/GLES2 + fbdev_mali, udev, alsathread, rgui)
video_driver = "gl"
video_context_driver = "fbdev_mali"
audio_driver = "alsathread"
input_driver = "udev"
input_joypad_driver = "udev"
input_autodetect_enable = "false"
menu_driver = "rgui"

# Video
video_fullscreen = "true"
video_vsync = "true"
video_threaded = "false"
video_smooth = "false"
fps_show = "true"
video_font_enable = "true"
# captura (ALT+Y, spec 026 D-08): o quadro cru do nucleo, sem o FPS nem o menu por cima
video_gpu_screenshot = "false"

# Entrada: ALT bloqueia o jogo sem atraso; o RetroArch nao sai nem mexe no volume (m17atalhos cuida disso)
input_hotkey_block_delay = "0"
quit_press_twice = "false"
menu_swap_ok_cancel_buttons = "true"

# Configuracao e saves so no cartao (RF-07); nada e regravado ao sair
config_save_on_exit = "false"
# remap do jogo (spec 025, D-06): quem ja tem .rmp do jogo o ve regravado ao sair; o primeiro
# e gravado pelo patch M17 quando o jogador mexe em Controls (sem o passo "Save Game Remap File")
remap_save_on_exit = "true"
savestate_auto_save = "false"
savestate_auto_load = "false"
libretro_directory = "@RAIZ@/cores"
libretro_info_path = "@RAIZ@/cores"
system_directory = "@RAIZ@/system"
savefile_directory = "@RAIZ@/saves"
savestate_directory = "@RAIZ@/states"
screenshot_directory = "@RAIZ@/screenshots"
cache_directory = "@RAIZ@/cache"
playlist_directory = "@RAIZ@/config/playlists"
core_options_path = "@RAIZ@/config/retroarch-core-options.cfg"
input_remapping_directory = "@RAIZ@/config/remaps"
rgui_config_directory = "@RAIZ@/config"
joypad_autoconfig_dir = "@RAIZ@/config/autoconfig"
assets_directory = "@RAIZ@/config/assets"
rgui_browser_directory = "@RAIZ@/roms"
